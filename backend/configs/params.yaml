entities:
  - borrower
  - lender
  - servicer
  - loan_amount
  - interest_rate
  - property_address
  - monthly_payment
  - loan_type
  - origination_date
  - modification_date
  - late_fee
  - escrow_account
  - foreclosure_notice
  - credit_bureau
  - date
  - amount

relations:
  - originated_by
  - serviced_by
  - secured_by
  - modified_to
  - failed_to_pay
  - charged
  - reported_to
  - issued_notice_to
  - disputed_by
  - resolved_with

thresholds:
  entity: 0.5
  relation: 0.5

ner:
  name: "models/gliner-relex-large-v0.5"

llm:
  name: "ollama/qwen3:0.6b"

discovery:
  pronouns: []
  determiners: []
  max_depth: 2
  max_relations: 100
  skip_headings:
    - "references"
    - "bibliography"
    - "acknowledgements"
    - "acknowledgments"
  max_seeds: 25

entity_merging:
  enabled: true

segmentation:
  enabled: true
  max_tokens: 1024
  overlap_tokens: 64
  workers: 0

citation:
  ollama_model: "ollama/qwen3:0.6b"
  ollama_api_base: "http://localhost:11434"
  keep_alive: "1m"
  max_refs: 15
  top_concepts: 15
  top_relations: 8
  max_chars: 24000
  stopwords_source: "language"
  stopwords_lang: "en"
  stopwords: []

data_source:
  type: "local_files"
  folder: "data/arxiv_pdfs"
  file_type: "pdf"