entities:
  - borrower
  - lender
  - servicer
  - loan_amount
  - interest_rate
  - property_address
  - monthly_payment
  - loan_type
  - origination_date
  - modification_date
  - late_fee
  - escrow_account
  - foreclosure_notice
  - credit_bureau
  - date
  - amount

relations:
  - originated_by
  - serviced_by
  - secured_by
  - modified_to
  - failed_to_pay
  - charged
  - reported_to
  - issued_notice_to
  - disputed_by
  - resolved_with

thresholds:
  entity: 0.5
  relation: 0.5

ner:
  name: "models/gliner-relex-large-v0.5"

keyword_extractor:
  name: "models/all-MiniLM-L6-v2"
  diversity: 0.7
  stop_words: "english"
  n_grams: [1, 2]
  adaptive:
    min_k: 2
    max_k: 20
    words_per_kw: 40
    score_floor: 0.2
    max_candidates: 25

llm:
  name: "ollama/qwen3:0.6b"

discovery:
  spacy_model: "models/en_core_web_sm"
  pronouns: []
  determiners: []
  max_depth: 2
  max_relations: 100

data_source:
  type: "local_files"
  folder: "data/case_2"
  file_type: "txt"