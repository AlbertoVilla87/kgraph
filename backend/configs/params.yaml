entities:
  - borrower
  - lender
  - servicer
  - loan_amount
  - interest_rate
  - property_address
  - monthly_payment
  - loan_type
  - origination_date
  - modification_date
  - late_fee
  - escrow_account
  - foreclosure_notice
  - credit_bureau
  - date
  - amount

relations:
  - originated_by
  - serviced_by
  - secured_by
  - modified_to
  - failed_to_pay
  - charged
  - reported_to
  - issued_notice_to
  - disputed_by
  - resolved_with

thresholds:
  entity: 0.5
  relation: 0.5

ner:
  name: "models/gliner-relex-large-v0.5"

keyword_extractor:
  name: "models/all-MiniLM-L6-v2"
  diversity: 0.7
  stop_words: "english"
  n_grams: [1, 2]
  adaptive:
    min_k: 2
    max_k: 10
    words_per_kw: 40
    score_floor: 0.2
    max_candidates: 5

llm:
  name: "ollama/qwen3:0.6b"

discovery:
  spacy_model: "models/en_core_web_sm"
  pronouns: []
  determiners: []
  max_depth: 2
  max_relations: 100
  skip_headings:
    - "references"
    - "bibliography"
    - "acknowledgements"
    - "acknowledgments"
  max_seeds: 25

entity_merging:
  enabled: true
  threshold: 0.85
  model: "models/all-MiniLM-L6-v2"

segmentation:
  enabled: true
  max_tokens: 1024
  overlap_tokens: 64
  workers: 0

citation:
  ollama_model: "ollama/qwen3:0.6b"
  ollama_api_base: "http://localhost:11434"
  keep_alive: "1m"
  max_refs: 15
  top_concepts: 15
  top_relations: 8
  max_chars: 24000
  stopwords_source: "spacy"
  stopwords: []

data_source:
  type: "local_files"
  folder: "data/arxiv_pdfs"
  file_type: "pdf"