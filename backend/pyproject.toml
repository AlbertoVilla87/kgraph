[project]
name = "kgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.113.0",
    "gliner>=0.2.27",
    "huggingface-hub>=1.26.0",
    "mkdocs-material>=9.7.7",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pyyaml",
    "streamlit>=1.59.2",
]
[project.scripts]
gliner-demo = "kgraph.cli.gliner_graph_demo:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kgraph"]