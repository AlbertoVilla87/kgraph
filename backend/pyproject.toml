[project]
name = "kgraph"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "beautifulsoup4>=4.12.0",
    "docling>=2.113.0",
    "fastapi>=0.115.0",
    "gliner>=0.2.28",
    "huggingface-hub>=1.26.0",
    "httpx>=0.28.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "keybert>=0.9.0",
    "kneed>=0.8.5",
    "litellm>=1.96.0",
    "matplotlib>=3.9",
    "network>=0.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pytextrank>=3.3.0",
    "pydantic>=2.13.4",
    "pyyaml",
    "spacy>=3.7",
    "streamlit>=1.59.2",
    "tqdm>=4.66",
    "uvicorn>=0.32.0",
]
[project.scripts]
gliner-demo = "kgraph.cli.gliner_graph_demo:main"
kbert-demo = "kgraph.cli.key_bert_demo:main"
qwen-demo = "kgraph.cli.qwen_demo:main"
discovery-demo = "kgraph.cli.topic_discovery_demo:main"
assembly-demo = "kgraph.cli.assembly_demo:main"
segmented-demo = "kgraph.cli.segmented_demo:main"
graph-viz = "kgraph.cli.graph_viz:main"
arxiv-demo = "kgraph.cli.arxiv_demo:main"
corpus-demo = "kgraph.cli.corpus_demo:main"
debug-abstract = "kgraph.cli.debug_abstract:main"
citation-demo = "kgraph.cli.citation_demo:main"
serve = "kgraph.api.main:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kgraph"]
