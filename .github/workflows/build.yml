# ── Build Docker images → ECR ──────────────────────────────────────
# Trigger: push a tag v* or manual dispatch.
# Uses GitHub OIDC to assume a Terraform-created IAM role (no static creds).
# Pushes kgraph/backend and kgraph/frontend to ECR with :vX.Y.Z + :latest.
# ───────────────────────────────────────────────────────────────────

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  BACKEND_REPO: kgraph/backend
  FRONTEND_REPO: kgraph/frontend

permissions:
  id-token: write
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:${{ steps.tag.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPO }}:${{ steps.tag.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
