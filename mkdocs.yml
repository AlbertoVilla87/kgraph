site_name: Astrolabe
site_description: Astrolabe — a knowledge graph that maps the state of the art of a research topic, spots what is original, and surfaces the gaps
site_author: Alberto

theme:
  name: material
  language: en
  icon:
    logo: material/graph
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand

nav:
  - Home: index.md
  - Overview: overview.md
  - Quickstart: quickstart.md
  - Architecture:
      - architecture/index.md
      - Ingestion: architecture/ingestion.md
      - Discovery: architecture/discovery.md
      - Assembly: architecture/assembly.md
      - Segmentation: architecture/segmentation.md
      - Data model & configuration: architecture/data-model.md
      - Runtime & API architecture: architecture/runtime.md
      - Application architecture: architecture/app-architecture.md
      - Deployment: architecture/deployment.md
      - CI/CD & AWS bootstrap: architecture/pipelines.md
      - AWS on-demand deployment: architecture/aws-ondemand.md
  - Demos: demos.md
  - Experiments:
      - experiments/index.md
      - Qwen vs. KeyBERT: experiments/exp_02_qwen_versus_keybert.ipynb
  - Roadmap: roadmap.md
  - Reports:
      - reports/index.md
      - Corpus pipeline timing: reports/corpus_timing.ipynb
  - Development / Tooling: development.md
  - References: references.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: false

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
