site_name: KG Builder Lab
site_description: kg-builder-lab — experimenting with multiple approaches to knowledge graph construction from documents
site_author: Alberto

theme:
  name: material
  language: en
  icon:
    logo: material/graph
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky

nav:
  - Home: index.md
  - Development / Tooling: development.md
  - Approaches:
      - Adaptive KeyBERT + Topic Discovery: approaches/adaptive_keybert_gliner.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js